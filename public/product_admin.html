<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Firebase Admin</title>
  <link rel="stylesheet" href="style/style_catalogo.css">

  <style>
    body { font-family: Arial, sans-serif; padding: 24px; background: #f9f9f9; }

    h1, h2 { color: #2b2b2b; }

    .panel { background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.08); padding: 20px; margin-bottom: 20px; }
    .field { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    
    input { padding: 10px; border: 1px solid #ccc; border-radius: 6px; width: 100%; }

    button { padding: 12px 18px; border: none; border-radius: 6px; background: #007bff; color: white; cursor: pointer; }
    button:disabled { opacity: .7; cursor: not-allowed; }
    .message { margin-top: 12px; }

    ul { list-style: none; padding: 0; }

    li { background: #f0f4ff; margin-bottom: 10px; padding: 10px 14px; border-radius: 6px; }
  </style>
</head>

<body>
  <div class="panel">
    <h1>Firebase Products Admin</h1>
    <p>Use this panel to add products to Firebase and run ETL to MySQL.</p>
  </div>

  <div class="panel">

    <h2>Create product in Firebase</h2>

    <form id="firebaseForm">

      <div class="field">
        <label for="productName">Name</label>
        <input id="productName" name="name" type="text" placeholder="Product name" required>
      </div>

      <div class="field">
        <label for="productPrice">Price</label>
        <input id="productPrice" name="price" type="number" step="0.01" placeholder="Product price" required>
      </div>

      <button id="createFirebaseBtn" type="submit">Create in Firebase</button>

    </form>
    <div class="message" id="firebaseResult"></div>
  </div>

  <div class="panel">
    <h2>Run ETL from Firebase to MySQL</h2>
    <button id="runEtlBtn">Run ETL Now</button>
    <div class="message" id="etlResult"></div>
  </div>

  <div class="panel">
    <h2>Firebase product list</h2>
    <button id="refreshFirebaseBtn">Refresh Firebase list</button>
    <ul id="firebaseProducts"></ul>
  </div>

  <script src="js/product_admin.js"></script>
</body>
</html>
